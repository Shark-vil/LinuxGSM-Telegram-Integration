name: Test and publish package

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependencies and run tests
        run: |
          python -m pip check
          python -m unittest -v
      - name: Validate Compose
        run: |
          cp .env.example .env
          docker compose --env-file .env config --quiet
      - name: Create source package
        run: |
          mkdir -p dist
          git archive --format=zip --output=dist/linuxgsm-telegram-bot.zip HEAD \
            bot.py test_bot.py requirements.txt README.md LICENSE Dockerfile docker-compose.yml \
            .env.example .dockerignore .gitignore servers.local.example.json servers.lan.example.json
          cd dist
          sha256sum linuxgsm-telegram-bot.zip > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: linuxgsm-telegram-bot
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish-image:
    needs: test-and-package
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build and publish Docker package to GHCR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=("$image:sha-$GITHUB_SHA")
          if [[ "$GITHUB_REF" == refs/heads/master ]]; then
            tags+=("$image:latest")
          elif [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tags+=("$image:$GITHUB_REF_NAME")
          fi
          docker build --tag "${tags[0]}" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
          docker run --rm --entrypoint python "${tags[0]}" -c 'import bot'
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          for tag in "${tags[@]}"; do
            if [[ "$tag" != "${tags[0]}" ]]; then
              docker tag "${tags[0]}" "$tag"
            fi
            docker push "$tag"
            printf 'Published image: `%s`\n' "$tag" >> "$GITHUB_STEP_SUMMARY"
          done
